name: Release theme

# Manual only. The tag comes from "version" in manifest.json,
# so bump it there before running this.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # manifest.json is the only file Chromium reads — this theme declares no
      # images — and it must sit at the root of the archive for the
      # drag-and-drop install on chrome://extensions to find it.
      - name: Build theme zip
        id: build
        run: |
          version="$(jq -r .version manifest.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          zip -X "Helium-Void-$version.zip" manifest.json
          unzip -l "Helium-Void-$version.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "Helium Void $VERSION" \
            --generate-notes \
            "Helium-Void-$VERSION.zip"
